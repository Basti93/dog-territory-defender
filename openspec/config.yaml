schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Dog Territory Defender: location-based mobile game for urban dog owners.
  Spring-like, joyful tone. Cookie-clicker background loop (The Den). Anti-snowball social layer.
  Stack: Expo SDK 54, React Native 0.81, React 19, TypeScript 5.9 strict. Local persistence via expo-sqlite
  (repository pattern, DynamoDB-shaped schema, AWS sync planned later — no cloud backend yet).
  Agile: work is pulled from the game backlog (openspec/specs/game-backlog/spec.md) by owner feedback and fun; no phase gates.
  Two process tiers: game-design changes (mechanics, economy) need an OpenSpec change; presentation work
  (UI, art, copy, tuning) and bug fixes/refactors go straight to code (see CLAUDE.md).
  The main session orchestrates; implementation, research and review go to sonnet subagents.
  Never use aggressive language ("conquer", "destroy", "kill", "battle") — use "claim", "defend", "protect".
  No dark mode. Full rules: CLAUDE.md, openspec/specs/den-economy/spec.md, openspec/specs/pack-collection/spec.md,
  openspec/specs/anti-snowball/spec.md (numeric thresholds are load-bearing).
  Game-design decisions are logged in the introducing OpenSpec change's proposal.md/design.md;
  presentation decisions in the open change's "Decisions log (presentation)" section.

